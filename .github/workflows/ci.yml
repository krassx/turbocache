name: build and test

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # a Windows failure must not hide a Linux pass
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }

      - name: Build the addon (no external dependencies)
        run: npx --yes node-gyp configure build

      - name: Core suite
        shell: bash
        run: |
          fail=0
          node test/run.js || fail=1
          echo "--- native_regression_test.cc (TTL wrap, log wrap gap, geometry)"
          c++ -std=c++17 -O2 -Isrc -o /tmp/native_test test/native_regression_test.cc \
            && /tmp/native_test || { echo "FAILED: native_regression_test"; fail=1; }
          echo "--- submit_test.cc (submission ring, standalone)"
          c++ -std=c++17 -O2 -Isrc -o /tmp/submit_test test/submit_test.cc -lpthread \
            && /tmp/submit_test || { echo "FAILED: submit_test"; fail=1; }
          exit $fail

      - name: TypeScript declarations
        shell: bash
        run: |
          npm i --no-save --silent typescript@5.4
          ./node_modules/.bin/tsc -p test/types/tsconfig.json

      - name: Cross-process behaviour
        shell: bash
        run: |
          node test/cluster_api_test.js
          node test/protect.js
          node test/hints.js

      - name: Concurrency stress (cross-process, zero torn reads expected)
        shell: bash
        run: |
          ARENA=4194304 NKEYS=2000 WORKERS=4 SECONDS=6 node test/multiproc.js | tee /tmp/mp.txt
          grep -q "CORRUPT/TORN READS: 0" /tmp/mp.txt

  sanitizers:
    name: TSan + ASan + UBSan (POSIX only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # TSAN does not exist for MSVC, so the gate over the lock-free read path
      # can only run on POSIX. That is why Linux/macOS are the platforms of
      # record for concurrency verification.
      - name: Sanitizer gate
        working-directory: test/tsan
        run: ./run_sanitizers.sh

  lz4-optional:
    name: opt-in LZ4 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: sudo apt-get update && sudo apt-get install -y liblz4-dev
      - name: Build with --turbocache_lz4=1 and verify compression works
        run: |
          npx --yes node-gyp configure build --turbocache_lz4=1
          node -e "
            const n=require('./build/Release/l2.node');
            if (!n.hasLz4()) { console.error('hasLz4() false in an LZ4 build'); process.exit(1); }
            n.create('/tcci'+process.pid, 16<<20, 1<<16, 2); n.setCompressMin(256,1);
            const v='{'+Array.from({length:200},(_,i)=>'\"k'+i+'\":'+i).join(',')+'}';
            n.set('c', v, 0,0,0);
            if (n.get('c') !== v) { console.error('compressed round-trip failed'); process.exit(1); }
            console.log('compressed round-trip ok');
          "
